spring:
  datasource:
    url: jdbc:h2:mem:wenxian-v2;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/test,classpath:db/migration

wenxian:
  v2:
    engine-version: 0.2.0-test
    content-version: qingqi-0.2.0
    max-active-saves: 2
    session-idle-hours: 12
