<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#edf5f2"><title>开物 · 连续试玩</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header class="topbar"><a href="/" class="brand">开物<span>DM 试玩</span></a><div class="header-actions"><button id="save-menu" type="button">存档</button><button id="new-game" type="button">另开一局</button></div></header>
<main><section class="intro"><p class="eyebrow">一段独立的修仙冒险</p><h1 id="story-title">一束草的去处</h1><p id="goal">从取料、制作到使用成果，让每次选择留下后果。</p><div class="intro-meta"><span>炼气散修</span><span>自由行动</span><span id="dm-status" role="status">正在连接资料…</span></div><label class="scenario-picker">新局场景<select id="scenario"><option value="paper-journey">一束草的去处 · 连续三场</option><option value="legacy">雨前取草 · 原短篇</option></select></label></section>
<section id="welcome" class="welcome"><p>DM 会依据开物资料回应你的行动。你可以先问清条件，也可以直接尝试。</p><button id="start" class="primary" type="button">进入药圃</button></section>
<div id="play" hidden><div class="play-layout"><section class="story-column"><div id="opening" class="opening"></div><div id="turns"></div><div id="pending" class="pending" hidden aria-live="polite"></div><div id="error" class="error" hidden role="alert"><p id="error-text"></p><button id="retry" type="button">重试本次行动</button><button id="dismiss-error" type="button">修改输入</button></div><form id="action-form" class="composer"><div class="mode-picker" aria-label="输入方式"><label><input type="radio" name="mode" value="ACT" checked>采取行动</label><label><input type="radio" name="mode" value="ASK">问 DM</label></div><label class="sr-only" for="action">你的行动或问题</label><textarea id="action" maxlength="1200" rows="3" placeholder="你准备怎样做？也可以先切到「问 DM」了解条件。"></textarea><div class="composer-bottom"><span id="input-hint">建议是可能的做法，你可以自由改写。</span><button id="submit" class="primary" type="submit">交给 DM</button></div><div id="suggestions" class="suggestions"></div></form></section>
<aside class="notes"><section><h2>此刻</h2><dl id="state"></dl></section><section><h2>随身物品</h2><ul id="inventory"></ul></section><section><h2>已学本领</h2><ul id="abilities"></ul></section><details class="journal"><summary>已记录的经历</summary><ol id="facts"></ol></details></aside></div></div>
<p id="global-error" class="error" hidden role="alert"></p><footer>独立试玩存档 · 资料来自开物 · 问 DM 不会替你行动</footer></main>
<dialog id="reference-dialog"><div class="reference-title"><h2 id="reference-title"></h2><button id="close-reference" aria-label="关闭资料" type="button">关闭</button></div><p id="reference-meta"></p><div id="reference-body"></div><a id="reference-link" target="_blank" rel="noopener noreferrer">在开物中查看</a></dialog>
<dialog id="saves-dialog"><div class="reference-title"><h2>本机试玩存档</h2><button id="close-saves" type="button">关闭</button></div><label id="resume-label" class="resume">继续本机试玩<select id="saves"><option value="">选择一局</option></select></label><p id="no-saves">还没有本机试玩存档。</p></dialog>
</body></html>
