server {
    server_name wenxianlu.cn www.wenxianlu.cn;

    root /var/www/wenxian/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/wenxian.access.log;
    error_log /var/log/nginx/wenxian.error.log;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "300" always;
        return 503 '{"code":"MAINTENANCE","message":"新版本仍在准备中，开放时间确认后将在官网更新"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wenxianlu.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wenxianlu.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.wenxianlu.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = wenxianlu.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name wenxianlu.cn www.wenxianlu.cn;
    return 404; # managed by Certbot
}
