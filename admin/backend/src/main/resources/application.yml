server:
  port: ${ADMIN_PORT:18081}

spring:
  application:
    name: wenxian-admin-backend
  config:
    import: optional:file:../../backend/src/main/resources/application-secret.yml
  datasource:
    url: ${ADMIN_DATABASE_URL:jdbc:mysql://127.0.0.1:3306/wenxian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${ADMIN_DATABASE_USERNAME:wenxian_app}
    password: ${ADMIN_DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      mode: always
      encoding: UTF-8

wenxian:
  ai-config-master-key: ${WENXIAN_AI_CONFIG_MASTER_KEY:wenxian-local-config-key-change-me}
  admin:
    initial-username: ${ADMIN_INITIAL_USERNAME:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
