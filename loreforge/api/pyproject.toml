[project]
name = "open5e-api"
version = "2.1.0"
requires-python = "==3.11.*"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework",
    "django-filter",
    "django-cors-headers",
    "drf-spectacular",
]

[dependency-groups]
dev = ["pytest", "pytest-django"]

[tool.uv]
required-version = ">=0.10"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "server.settings"
testpaths = ["api_v2/tests/test_loreforge.py", "api_v2/tests/test_loreforge_cultivation.py", "api_v2/tests/test_loreforge_catalog.py"]
