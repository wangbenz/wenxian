# 域名入口机目前仍会把 wenxianlu.cn 的 API 转发到京东云 25173，并改写 Host。
# 除 Host 隔离外，还必须按固定入口机源地址将正式流量送回 V0.14。
map $remote_addr $wenxian_25173_backend_port {
    8.217.11.8 18180;
    default 18181;
}

map $remote_addr $wenxian_25173_h5_root {
    8.217.11.8 /var/www/wenxian-test/current;
    default /var/www/wenxian-v015/current;
}

server {
    listen 25173;
    listen [::]:25173;
    server_name wenxianlu.cn www.wenxianlu.cn;

    root /var/www/wenxian-test/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/wenxian-v015-production-bridge.access.log;
    error_log /var/log/nginx/wenxian-v015-production-bridge.error.log;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 25173 default_server;
    listen [::]:25173 default_server;
    server_name _;

    # 25173 使用独立静态目录，不复用 wenxianlu.cn 的当前版本软链接。
    root $wenxian_25173_h5_root;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/wenxian-v015.access.log;
    error_log /var/log/nginx/wenxian-v015.error.log;

    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # V0.15 H5 只转发到独立的 18181 后端。
    location /api/ {
        proxy_pass http://127.0.0.1:$wenxian_25173_backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
