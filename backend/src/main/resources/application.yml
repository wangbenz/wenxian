server:
  port: ${PORT:18080}

spring:
  application:
    name: wenxian-game-backend
  config:
    import: optional:file:./src/main/resources/application-secret.yml
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${GAME_DATABASE_URL:jdbc:mysql://127.0.0.1:3306/wenxian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${GAME_DATABASE_USERNAME:wenxian_app}
    password: ${GAME_DATABASE_PASSWORD:}
    driver-class-name: ${GAME_DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      maximum-pool-size: ${GAME_DATABASE_MAX_POOL_SIZE:100}
      minimum-idle: 1
      idle-timeout: 180000
      max-lifetime: 240000
      keepalive-time: 60000
  sql:
    init:
      mode: always
      encoding: UTF-8

game:
  story-migration:
    admin-token: ${WENXIAN_MIGRATION_ADMIN_TOKEN:}
  cors:
    allowed-origin-patterns: ${WENXIAN_CORS_ALLOWED_ORIGIN_PATTERNS:http://127.0.0.1:*,http://localhost:*,http://192.168.*:*,http://10.*:*,http://172.*:*}
  invite:
    bootstrap-code: ${WENXIAN_INVITE_CODE:WENXIAN-LOCAL}
  auth:
    session-days: ${WENXIAN_SESSION_DAYS:30}
    idle-hours: ${WENXIAN_SESSION_IDLE_HOURS:12}
    secure-cookie: ${WENXIAN_SECURE_COOKIE:false}
    ip-hash-pepper: ${WENXIAN_IP_HASH_PEPPER:wenxian-local-ip-pepper-change-me}
    registrations-per-ip-per-day: ${WENXIAN_REGISTRATIONS_PER_IP_PER_DAY:1}
    login-failures-per-window: ${WENXIAN_LOGIN_FAILURES_PER_WINDOW:5}
    # 独立灰度进程专用。启用后只认进程环境中的账号名单，不读取共享 RDS 的正式白名单模式。
    isolated-access:
      enabled: ${WENXIAN_ISOLATED_ACCESS_ENABLED:false}
      allowed-emails: ${WENXIAN_ISOLATED_ACCESS_ALLOWED_EMAILS:}
      title: ${WENXIAN_ISOLATED_ACCESS_TITLE:当前版本正在受邀测试}
      message: ${WENXIAN_ISOLATED_ACCESS_MESSAGE:当前版本仅向受邀账号开放，请使用收到的测试账号进入。}
      resume-at: ${WENXIAN_ISOLATED_ACCESS_RESUME_AT:}
  ai-config-master-key: ${WENXIAN_AI_CONFIG_MASTER_KEY:wenxian-local-config-key-change-me}
  ai-config-force-environment: ${WENXIAN_AI_CONFIG_FORCE_ENVIRONMENT:false}
  story-correction-token-secret: ${WENXIAN_STORY_CORRECTION_TOKEN_SECRET:${WENXIAN_AI_CONFIG_MASTER_KEY:wenxian-local-config-key-change-me}}
  story-correction-token-ttl-minutes: ${WENXIAN_STORY_CORRECTION_TOKEN_TTL_MINUTES:10}

wenxian:
  story:
    trusted-turns-enabled: ${WENXIAN_TRUSTED_TURNS_ENABLED:false}
    # 仅灰度/定向排障开启；记录上下文来源和事实提交概要，不复制完整正文与 Prompt。
    turn-diagnostics-enabled: ${WENXIAN_STORY_TURN_DIAGNOSTICS_ENABLED:false}
    # 行动事实解析与独立语义审阅默认使用低延迟 Flash；二者均不共享正文生成上下文。
    flash-review-model: ${WENXIAN_STORY_FLASH_REVIEW_MODEL:deepseek-v4-flash}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
